name: Generate Profile Stats

on:
  schedule:
    - cron: "0 2 * * *" # roda todo dia às 2h (UTC)
  workflow_dispatch: # permite rodar manualmente
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@main
        with:
          card: stats
          options: username=leoSinhorine&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=4FA8FF&icon_color=60A5FA&text_color=FFFFFF
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@main
        with:
          card: top-langs
          options: username=leoSinhorine&layout=compact&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=4FA8FF&text_color=FFFFFF
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak stats card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=leoSinhorine&theme=tokyonight&background=0D1117&border=1976D2&stroke=1976D2&ring=4FA8FF&fire=4FA8FF&currStreakLabel=4FA8FF&sideLabels=FFFFFF&currStreakNum=FFFFFF&sideNums=FFFFFF&dates=8B949E
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg profile/streak.svg
          git commit -m "Update profile stats" || exit 0
          git push
