name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # roda todo dia à meia-noite (UTC)
  workflow_dispatch: # permite rodar manualmente
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: leoSinhorine
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%231976D2&color_dots=%230D1117,%230D2B4E,%231976D2,%234FA8FF,%2393C5FD
            dist/github-contribution-grid-snake-dark.svg?color_snake=%234FA8FF&color_dots=%230D1117,%230D2B4E,%231976D2,%234FA8FF,%2393C5FD
            dist/github-contribution-grid-snake.gif?color_snake=%234FA8FF&color_dots=%230D1117,%230D2B4E,%231976D2,%234FA8FF,%2393C5FD

      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
