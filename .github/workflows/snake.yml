name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # roda todo dia à meia-noite (UTC)
  workflow_dispatch: # permite rodar manualmente
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: leoSinhorine
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%230D47A1&color_dots=%230D1117,%230A3D91,%231565C0,%231E88E5,%2364B5F6
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2364B5F6&color_dots=%230D1117,%230A3D91,%231565C0,%231E88E5,%2364B5F6
            dist/github-contribution-grid-snake.gif?color_snake=%2364B5F6&color_dots=%230D1117,%230A3D91,%231565C0,%231E88E5,%2364B5F6

      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
